{% extends "base.html" %}

{% block content %}
<section class="page-head">
    <div>
        <h1>Мои заметки</h1>
        <p class="muted">Создавай, редактируй и удаляй заметки.</p>
    </div>
    <a class="button secondary" href="/app/folders">Управлять папками</a>
</section>

<section class="panel">
    <h2>Новая заметка</h2>

    <form id="note-form" class="form grid-form">
        <label>
            Заголовок
            <input name="title" type="text" maxlength="100" required>
        </label>

        <label>
            Папка
            <select name="folder_id" id="folder-select">
                <option value="">Без папки</option>
            </select>
        </label>

        <label class="checkbox-row">
            <input name="is_public" type="checkbox">
            Публичная заметка
        </label>

        <label class="full-width">
            Текст
            <textarea name="content" rows="5" required></textarea>
        </label>

        <button type="submit" class="button">Добавить заметку</button>
    </form>
</section>

<section class="toolbar">
    <input id="search-input" type="search" placeholder="Поиск по заголовку или тексту">
    <button id="reload-notes" class="button secondary">Обновить</button>
</section>

<section id="notes-list" class="cards"></section>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', path='js/notes.js') }}?v=3"></script>
{% endblock %}
