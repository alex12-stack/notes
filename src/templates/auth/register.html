{% extends "base.html" %}

{% block content %}
<section class="auth-card">
    <h1>Регистрация</h1>
    <p class="muted">Создай аккаунт для хранения заметок и папок.</p>

    <form id="register-form" class="form">
        <label>
            Имя пользователя
            <input name="username" type="text" minlength="4" maxlength="30" autocomplete="username" required>
        </label>

        <label>
            Email
            <input name="email" type="email" maxlength="50" autocomplete="email" required>
        </label>

        <label>
            Пароль
            <input name="password" type="password" minlength="4" maxlength="100" autocomplete="new-password" required>
        </label>

        <button type="submit" class="button">Создать аккаунт</button>
    </form>

    <p class="muted center auth-switch">
        Уже есть аккаунт? <a href="/app/login">Войти</a>
    </p>
</section>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', path='js/auth.js') }}?v=3"></script>
{% endblock %}
